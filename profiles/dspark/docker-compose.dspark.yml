services:
  vllm-dspark:
    image: ${DSPARK_VLLM_IMAGE:-ghcr.io/anemll/dspark-vllm-gx10:0.1.1}
    pull_policy: if_not_present
    restart: unless-stopped
    entrypoint: []
    network_mode: host
    ipc: host
    shm_size: "64gb"

    ulimits:
      memlock: -1
      stack: 67108864

    gpus: all

    devices:
      - /dev/infiniband:/dev/infiniband

    volumes:
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/cache/huggingface
      # Optional Stage-C overlay: host proposer only when path exists on the
      # Anemll layout (vLLM ships DSpark under v1/worker/gpu/spec_decode).
      # GB10 hybrid plugin tree for ENABLE_VLLM_GB10_PATCH=1 only.
      - ${VLLM_GB10_PATCH_DIR:-./vllm_patch_gb10}:/opt/vllm-gb10-hybrid-nvfp4
      # Issue #22 hotfix (nvfp4_ds_mla dispatched to the slow BF16 KV kernel).
      # This lane serves --kv-cache-dtype nvfp4_ds_mla too, so it is affected.
      # NOTE: the Issue #21 encoder hotfix is deliberately NOT mounted here. That
      # bug lives in the CHECKPOINT's encoding_dsv4.py, which only the 0731 lane
      # copies over the image's copy. The stock image encoder already dispatches
      # on type correctly, so mounting it here would only log a WARN every boot.
      - ${DSPARK_NVFP4_ISSUE22_HOTFIX:-./patches/hotfix-nvfp4-ds-mla-issue22.sh}:/opt/hotfix-nvfp4-ds-mla-issue22.sh:ro
      # vLLM 0.27 DSV4 perf backports (upstream, commit titled "Backport six vLLM 0.27 DSV4 perf hotfixes to 0.1.1 image" — cite by title, NOT SHA: upstream force-pushes main): now ten idempotent hotfixes — .sh anchor-patchers plus the .py file-patchers upstream added 2026-08-13,
      # run from the command below BEFORE vLLM is imported — same reasoning as the
      # Issue #22 mount above, and the reason we do NOT use upstream's
      # apply-then-restart path (that costs a second weight load per rank).
      # Mounted as a directory so adding a seventh script needs no compose change.
      # Rank 1 gets its own copy via the start script's patches/ sync; without it
      # docker would mount an empty dir here and the worker would run unpatched.
      - ${DSPARK_DSV4_HOTFIX_DIR:-./patches}:/opt/dsv4-hotfixes:ro
      - ${DSPARK_TMP_HOST:-${HOME}/.cache/dspark-tmp}:/tmp

    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-0}"
      HF_HUB_DISABLE_XET: "${HF_HUB_DISABLE_XET:-1}"
      VLLM_CACHE_ROOT: /cache/huggingface/vllm-cache
      # Long-context crash fix kill-switch: 1 (default) clamps stale DSpark
      # draft-KV slot ids; 0 = detect+log only.
      DSPARK_SLOT_CLAMP: "${DSPARK_SLOT_CLAMP:-1}"
      VLLM_HOST_IP: "${VLLM_HOST_IP:-}"

      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "${VLLM_ALLOW_LONG_MAX_MODEL_LEN:-1}"
      VLLM_TRITON_MLA_SPARSE: "${VLLM_TRITON_MLA_SPARSE:-1}"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "${VLLM_SPARSE_INDEXER_MAX_LOGITS_MB:-256}"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "${VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS:-0}"
      VLLM_SKIP_INIT_MEMORY_CHECK: "${VLLM_SKIP_INIT_MEMORY_CHECK:-1}"
      ENABLE_VLLM_GB10_PATCH: "${ENABLE_VLLM_GB10_PATCH:-0}"
      GB10_HYBRID_NVFP4_M_THRESHOLD: "${GB10_HYBRID_NVFP4_M_THRESHOLD:-128}"
      # 1 = do not apply the Issue #22 nvfp4_ds_mla decode hotfix.
      DSPARK_SKIP_HOTFIX: "${DSPARK_SKIP_HOTFIX:-0}"

      # 1 = do not apply the six vLLM 0.27 DSV4 perf backports.
      # NOTE on naming: upstream overloads DSPARK_SKIP_HOTFIX to mean "skip the
      # v0.27 backports" and uses DSPARK_SKIP_ISSUE22_HOTFIX for Issue #22. Here
      # DSPARK_SKIP_HOTFIX already meant Issue #22 (above) long before the
      # backports existed, so the new knob gets its own name rather than silently
      # changing what an existing variable does. Watch for this when syncing
      # upstream's start script.
      DSPARK_SKIP_DSV4_027_HOTFIX: "${DSPARK_SKIP_DSV4_027_HOTFIX:-0}"

      VLLM_USE_FLASHINFER_SAMPLER: "${VLLM_USE_FLASHINFER_SAMPLER:-1}"

      # Issue #26: sparsify SWA (DSpark draft/indexer) prefix-cache checkpoints to
      # one tail per N-token segment + the replay boundary, so dense SWA tails stop
      # evicting MLA prefix blocks. MUST be a multiple of 256 (scheduler block size);
      # empty is NOT supported via compose default. Pairs with
      # patches/hotfix-dsv4-issue26-hybrid-swa-min.py, which stops an SWA window hit
      # from zeroing the MLA common hit. Measured here 2026-08-12 (pre-fix): a 54.8k
      # prefix-cache hit took 5.18s while 109k/219k hits took 0.57s/0.86s — the kind
      # of inverted result this pair is meant to remove.
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "${VLLM_PREFIX_CACHE_RETENTION_INTERVAL:-4096}"

      VLLM_USE_B12X_MOE: "${VLLM_USE_B12X_MOE:-1}"
      VLLM_USE_B12X_WO_PROJECTION: "${VLLM_USE_B12X_WO_PROJECTION:-1}"
      VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM: "${VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM:-0}"
      VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M: "${VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M:-16}"
      VLLM_B12X_W4A16_FORCE_TILE_CONFIG: "${VLLM_B12X_W4A16_FORCE_TILE_CONFIG:-}"
      B12X_W4A16_TC_DECODE: "${B12X_W4A16_TC_DECODE:-0}"

      VLLM_DSPARK_CONFIDENCE_THRESHOLD: "${VLLM_DSPARK_CONFIDENCE_THRESHOLD:-0.0}"
      VLLM_DSPARK_CONFIDENCE_SCHEDULER: "${VLLM_DSPARK_CONFIDENCE_SCHEDULER:-off}"
      VLLM_DSPARK_LOCAL_ARGMAX: "${VLLM_DSPARK_LOCAL_ARGMAX:-1}"
      VLLM_DSPARK_REPLICATE_MARKOV_W1: "${VLLM_DSPARK_REPLICATE_MARKOV_W1:-1}"
      VLLM_DSPARK_FUSED_MARKOV_ARGMAX: "${VLLM_DSPARK_FUSED_MARKOV_ARGMAX:-0}"
      VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK: "${VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK:-1}"
      VLLM_DSPARK_REFERENCE_KV_QUANT_DEQUANT: "${VLLM_DSPARK_REFERENCE_KV_QUANT_DEQUANT:-0}"
      VLLM_DSPARK_HARDWARE_SCHEDULER_EARLY_STOP: "${VLLM_DSPARK_HARDWARE_SCHEDULER_EARLY_STOP:-1}"
      VLLM_DSV4_B12X_COMPRESSED_MLA: "${VLLM_DSV4_B12X_COMPRESSED_MLA:-0}"
      VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE: "${VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE:-0}"
      VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE_EXACT: "${VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE_EXACT:-0}"

      TORCH_CUDA_ARCH_LIST: "${TORCH_CUDA_ARCH_LIST:-12.1a}"
      FLASHINFER_CUDA_ARCH_LIST: "${FLASHINFER_CUDA_ARCH_LIST:-12.1a}"
      # Targets CuTeDSL kernel compilation at GB10 (sm_121a). Without this,
      # vLLM JIT-compiles a slower W4A16FusedMoeKernel mid-inference instead
      # of using GB10-native kernels — confirmed via live boot logs.
      CUTE_DSL_ARCH: "${CUTE_DSL_ARCH:-sm_121a}"
      FLASHINFER_DISABLE_VERSION_CHECK: "${FLASHINFER_DISABLE_VERSION_CHECK:-1}"
      FLASHINFER_WORKSPACE_BASE: "${FLASHINFER_WORKSPACE_BASE:-/cache/huggingface/flashinfer}"
      TILELANG_CLEANUP_TEMP_FILES: "${TILELANG_CLEANUP_TEMP_FILES:-1}"
      DG_JIT_USE_NVRTC: "${DG_JIT_USE_NVRTC:-0}"
      DG_JIT_NVCC_COMPILER: "${DG_JIT_NVCC_COMPILER:-/usr/local/cuda/bin/nvcc}"
      PYTORCH_CUDA_ALLOC_CONF: "${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}"

      NCCL_NET: "${NCCL_NET:-IB}"
      NCCL_IB_DISABLE: "${NCCL_IB_DISABLE:-0}"
      NCCL_IB_HCA: "${NCCL_IB_HCA}"
      NCCL_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME}"
      TP_SOCKET_IFNAME: "${TP_SOCKET_IFNAME:-${NCCL_SOCKET_IFNAME}}"
      GLOO_SOCKET_IFNAME: "${GLOO_SOCKET_IFNAME:-${NCCL_SOCKET_IFNAME}}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-}"
      NCCL_IB_ADDR_FAMILY: "${NCCL_IB_ADDR_FAMILY:-AF_INET}"
      NCCL_IB_ROCE_VERSION_NUM: "${NCCL_IB_ROCE_VERSION_NUM:-2}"
      NCCL_CROSS_NIC: "${NCCL_CROSS_NIC:-1}"
      NCCL_CUMEM_ENABLE: "${NCCL_CUMEM_ENABLE:-0}"
      NCCL_IGNORE_CPU_AFFINITY: "${NCCL_IGNORE_CPU_AFFINITY:-1}"
      NCCL_DEBUG: "${NCCL_DEBUG:-WARN}"
      NCCL_NVLS_ENABLE: "${NCCL_NVLS_ENABLE:-0}"

      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS:-}"
      MASTER_ADDR: "${MASTER_ADDR}"
      MASTER_PORT: "${MASTER_PORT:-25000}"
      MTP_NUM_TOKENS: "${MTP_NUM_TOKENS:-3}"

    command:
      - bash
      - -lc
      - >
        export PATH="/usr/local/cuda/bin:/usr/local/bin:$${PATH:-}";
        export CUDA_HOME="$${CUDA_HOME:-/usr/local/cuda}";
        export CUDA_PATH="$${CUDA_PATH:-$${CUDA_HOME}}";
        export CUDAToolkit_ROOT="$${CUDAToolkit_ROOT:-$${CUDA_HOME}}";
        export LD_LIBRARY_PATH="/usr/local/cuda/lib64:$${LD_LIBRARY_PATH:-}";
        if [ "$${DSPARK_SKIP_HOTFIX:-0}" != "1" ] && [ -f /opt/hotfix-nvfp4-ds-mla-issue22.sh ]; then bash /opt/hotfix-nvfp4-ds-mla-issue22.sh || echo "WARN: Issue #22 hotfix did not apply" >&2; fi;
        if [ "$${DSPARK_SKIP_DSV4_027_HOTFIX:-0}" != "1" ] && [ -d /opt/dsv4-hotfixes ]; then n=0; for h in /opt/dsv4-hotfixes/hotfix-dsv4-*.sh; do [ -f "$$h" ] || continue; n=$$((n+1)); bash "$$h" >/dev/null 2>&1 || echo "WARN: $$(basename $$h) did not apply" >&2; bash "$$h" --status 2>&1 | grep -q "NOT APPLIED" && echo "WARN: $$(basename $$h) reports NOT APPLIED after run" >&2; done; for p in /opt/dsv4-hotfixes/hotfix-dsv4-*.py; do [ -f "$$p" ] || continue; n=$$((n+1)); python3 "$$p" >/dev/null 2>&1 || echo "WARN: $$(basename $$p) did not apply - anchor missing, it refuses rather than corrupt" >&2; done; echo "DSV4 hotfixes applied: $$n"; [ "$$n" -eq 0 ] && echo "WARN: no hotfix-dsv4-* in /opt/dsv4-hotfixes - THIS RANK IS UNPATCHED (worker patches/ sync missing?)" >&2; fi;
        VLLM_QUANTIZATION_ARGS="";
        if [ "$${ENABLE_VLLM_GB10_PATCH:-0}" = "1" ]; then
          python3 -m pip install -e /opt/vllm-gb10-hybrid-nvfp4 --no-deps;
          export VLLM_PLUGINS="$${VLLM_PLUGINS:-gb10_hybrid_nvfp4}";
          VLLM_QUANTIZATION_ARGS="--quantization modelopt_gb10_hybrid";
        fi;
        SPECULATIVE_CONFIG="{\"method\":\"dspark\",\"num_speculative_tokens\":$${MTP_NUM_TOKENS:-3},\"draft_sample_method\":\"probabilistic\"}";
        exec /usr/local/bin/vllm serve ${DSPARK_MODEL:-deepseek-ai/DeepSeek-V4-Flash-DSpark}
        --served-model-name ${SERVED_MODEL_NAME:-deepseek-v4-flash-dspark}
        --host ${VLLM_HOST:-127.0.0.1}
        --port ${VLLM_PORT:-8888}
        --trust-remote-code
        $${VLLM_QUANTIZATION_ARGS}
        --tensor-parallel-size 2
        --pipeline-parallel-size 1
        --kv-cache-dtype nvfp4_ds_mla
        --block-size 256
        --max-model-len ${MAX_MODEL_LEN:-1048576}
        --max-num-seqs ${MAX_NUM_SEQS:-6}
        --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-8192}
        --long-prefill-token-threshold ${LONG_PREFILL_TOKEN_THRESHOLD:-1024}
        --max-cudagraph-capture-size $$(( ${MAX_NUM_SEQS:-6} * (${MTP_NUM_TOKENS:-3} + 1) ))
        --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.80}
        --enable-prefix-caching
        --async-scheduling
        --enable-chunked-prefill
        --speculative-config "$${SPECULATIVE_CONFIG}"
        --tokenizer-mode deepseek_v4
        --distributed-executor-backend mp
        --moe-backend flashinfer_b12x
        --tool-call-parser deepseek_v4
        --enable-auto-tool-choice
        --reasoning-parser deepseek_v4
        --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
        --default-chat-template-kwargs '{"thinking":false}'
        --generation-config vllm
        --enable-flashinfer-autotune
        --nnodes 2
        --node-rank ${NODE_RANK}
        --master-addr ${MASTER_ADDR}
        --master-port ${MASTER_PORT:-25000}
        ${HEADLESS:+--headless}
